# ---------- MySQL profile ----------
# Activate with:  --spring.profiles.active=mysql
# (or pick "Backend (MySQL)" in VS Code's Run and Debug panel)
#
# The database "studentdb" is created automatically if it does not exist.
# Change the username/password below to match YOUR MySQL installation.

spring.datasource.url=jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
