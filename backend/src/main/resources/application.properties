spring.application.name=student-crud
server.port=8080

# ---------- Default database: H2 in-memory (no installation needed) ----------
# Data resets every time the app restarts. Use the "mysql" profile to keep data.
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# Browse the H2 database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:studentdb  user: sa  password: empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# "update" creates/updates tables from the @Entity classes automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Return dates as ISO text, e.g. 2026-11-12T10:15:30
spring.jackson.serialization.write-dates-as-timestamps=false
